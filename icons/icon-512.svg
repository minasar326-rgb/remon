<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8"/>
  <!-- Two Swords (أبي سيفين) Symbol -->
  <g transform="translate(256, 256)">
    <!-- Sword 1 -->
    <path d="M-8 -150 L8 -150 L12 80 L-12 80 Z" fill="url(#goldGrad)" transform="rotate(-30)"/>
    <rect x="-35" y="70" width="70" height="12" rx="4" fill="#cbd5e1" transform="rotate(-30)"/>
    <rect x="-6" y="82" width="12" height="40" rx="3" fill="#94a3b8" transform="rotate(-30)"/>
    <circle cx="0" cy="128" r="10" fill="url(#goldGrad)" transform="rotate(-30)"/>

    <!-- Sword 2 -->
    <path d="M-8 -150 L8 -150 L12 80 L-12 80 Z" fill="url(#goldGrad)" transform="rotate(30)"/>
    <rect x="-35" y="70" width="70" height="12" rx="4" fill="#cbd5e1" transform="rotate(30)"/>
    <rect x="-6" y="82" width="12" height="40" rx="3" fill="#94a3b8" transform="rotate(30)"/>
    <circle cx="0" cy="128" r="10" fill="url(#goldGrad)" transform="rotate(30)"/>
    
    <!-- Central Coptic Cross -->
    <path d="M-10 -70 H10 V-10 H70 V10 H10 V70 H-10 V10 H-70 V-10 H-10 Z" fill="#ffffff" filter="drop-shadow(0 0 10px rgba(245, 158, 11, 0.8))"/>
  </g>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">كنيسة أبي سيفين</text>
</svg>